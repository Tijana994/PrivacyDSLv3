name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the OCL rule coverage badge on master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and run OCL rule tests
        run: bash ci/run-tests.sh

      - name: OCL rule coverage
        if: always()
        run: python3 ci/rule-coverage.py --summary "$GITHUB_STEP_SUMMARY" --badge .github/badges/ocl-rules.svg

      - name: Commit coverage badge
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          if [[ -n "$(git status --porcelain .github/badges)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/badges
            git commit -m "Update OCL rule coverage badge"
            git push
          fi
